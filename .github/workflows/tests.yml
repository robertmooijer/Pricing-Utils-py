name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        pandas: ["pandas>=2.1,<3", "pandas>=3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.pandas }}"
          pip install -e ".[dev]"
      - name: Tests (the R parity tests need R and are skipped here)
        run: pytest -q -m "not parity"
